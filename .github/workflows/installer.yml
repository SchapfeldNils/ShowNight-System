name: Streaming installer
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24.19.0" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm server:package
      - run: pnpm streaming:installer
      - run: pnpm test:installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shownight-streaming-setup-server-preview
          retention-days: 14
          path: |
            dist/streaming-installer/
            test-results/installer/
