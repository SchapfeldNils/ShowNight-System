name: Native renderer
on:
  pull_request:
    # Reine Doku-Änderungen brauchen keinen Windows-Nativbuild.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
concurrency:
  group: renderer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-renderer:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24.19.0" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: MSVC build environment
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCToolsVersion','WindowsSdkDir','WindowsSDKVersion','UniversalCRTSdkDir','UCRTVersion') | ForEach-Object { $value = [Environment]::GetEnvironmentVariable($_); if ($value) { "$_=$value" >> $env:GITHUB_ENV } }
      - run: pnpm typecheck
      - run: pnpm build
      # Caches: identische Pfadlisten für Restore und Save, sonst greift der
      # Cache nie (bis Oktober 2026 der Fall). Skia ist an Runner-Image (MSVC)
      # und Buildskript (Revision, Argumente) gebunden; GStreamer an die
      # offiziell geprüfte SDK-Prüfsumme. Inhalte werden vom Buildskript
      # weiterhin gegen Revision bzw. SHA256 geprüft.
      - name: Runner image
        id: image
        shell: pwsh
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - name: Restore verified GStreamer SDK
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .local/renderer-build/gstreamer-1.0-msvc-x86_64-1.28.8.exe
            .local/renderer-build/gst
          key: windows-gstreamer-1.28.8-e4c41ee6ee9c6c32-v2
      - name: Restore Skia build
        id: skia-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local/renderer-build/skia
          key: windows-skia-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/renderer-build.mjs') }}-v1
      - name: Build native renderer from pinned sources
        id: build
        run: pnpm renderer:build
      - name: Save verified GStreamer SDK
        if: always() && steps.build.outcome == 'success' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .local/renderer-build/gstreamer-1.0-msvc-x86_64-1.28.8.exe
            .local/renderer-build/gst
          key: windows-gstreamer-1.28.8-e4c41ee6ee9c6c32-v2
      - name: Save Skia build
        if: always() && steps.build.outcome == 'success' && steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .local/renderer-build/skia
          key: windows-skia-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/renderer-build.mjs') }}-v1
      - name: Test real native process without display or audio output
        env:
          RENDERER_TEST_BROWSER: "true"
        run: pnpm test:renderer
      - run: pnpm renderer:package
      - name: Test portable server and renderer bundle
        env:
          RENDERER_TEST_PORTABLE: "true"
        shell: pwsh
        # Bei Fehlern die letzten Zeilen als Annotation zeigen (Logs sind nicht
        # überall abrufbar); Ergebnis und Exitcode bleiben unverändert.
        run: |
          pnpm test:renderer 2>&1 | Tee-Object -FilePath portable-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content portable-test.log -Tail 60 | Where-Object { $_.Trim() } | ForEach-Object { "::error title=Portabler Renderer-Test::" + ($_ -replace '%','%25') }
            exit $code
          }
      - run: pnpm streaming:installer --renderer
      - run: pnpm test:installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shownight-renderer-software-proof
          retention-days: 7
          path: |
            test-results/renderer/
            .local/renderer-build/gst-install.log
            .local/renderer-build/gst.sha256sum
            dist/renderer-windows/versions.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shownight-server-renderer-windows-x64
          retention-days: 7
          path: |
            dist/shownight-server-renderer-windows-x64.zip
            dist/shownight-server-renderer-windows-x64.zip.sha256
            dist/streaming-installer/
