name: S1 checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: s1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm, ffprobe: /usr/bin/ffprobe }
    runs-on: ${{ matrix.runner }}
    env:
      FFPROBE_PATH: ${{ matrix.ffprobe || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.19.0" }
      - run: npm install --global pnpm@11.25.0
      - if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:integration
      - run: pnpm test:agents
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm licenses:inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: s1-test-results-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
            docs/entwicklung/dependency-licenses.json
      - name: Build and verify complete Docker stack
        run: |
          docker build -t shownight:ci .
          sh tests/container-smoke.sh
      - name: Export verified image for installation
        env:
          IMAGE_TAG: shownight:${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.arch }}
        run: |
          docker tag shownight:ci "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" --format '{{.Id}} {{.Os}}/{{.Architecture}}' > .local/container/image-info.txt
          docker run --rm --entrypoint ffmpeg "$IMAGE_TAG" -version >> .local/container/image-info.txt
          docker save "$IMAGE_TAG" | gzip > .local/container/shownight-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shownight-image-${{ matrix.arch }}
          retention-days: 7
          compression-level: 0
          path: |
            .local/container/shownight-${{ matrix.arch }}.tar.gz
            .local/container/image-info.txt
  windows-agent:
    name: Windows agent
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24.19.0" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm agent:package
      - run: pnpm test:agents
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shownight-agent-windows-x64
          retention-days: 7
          path: |
            dist/shownight-agent-windows-x64.zip
            dist/shownight-agent-windows-x64.zip.sha256
