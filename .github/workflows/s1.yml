name: S1 checks
on:
  pull_request:
  push:
    branches: [feat/s1-online-server]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.19.0" }
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm licenses:inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-test-results
          path: |
            test-results/
            playwright-report/
            docs/entwicklung/dependency-licenses.json
      - name: Build and verify complete Docker stack
        run: |
          docker build -t shownight:ci .
          sh tests/container-smoke.sh
